<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benzinpriser 3550</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 30px 15px;
        font-family: Arial, sans-serif;
        background: #f3f5f7;
        color: #222;
    }

    .container {
        max-width: 700px;
        margin: auto;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
    }

    .station {
        background: white;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 12px;
        box-shadow: 0 2px 8px #0000000d;
    }

    .station h2 {
        margin: 0 0 5px;
        font-size: 19px;
    }

    .address {
        color: #777;
        font-size: 14px;
        margin-bottom: 15px;
    }

    .fuel {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-top: 1px solid #eee;
    }

    .price {
        font-weight: bold;
        font-size: 20px;
        color: #167c45;
    }

    button {
        padding: 12px 20px;
        background: #167c45;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        background: #105d33;
    }

    #status {
        color: #777;
        font-size: 13px;
        margin: 15px 0;
    }

    .empty {
        padding: 25px;
        background: white;
        border-radius: 12px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">

    <h1>⛽ Benzinpriser</h1>
    <div class="subtitle">
        Tankstationer i 3550 Slangerup
    </div>

    <button onclick="loadPrices()">
        Opdater priser
    </button>

    <div id="status">Henter priser...</div>

    <div id="stations"></div>

</div>

<script>

const API_URL =
    "https://proxy.cors.dev/https://mobility-prices.ok.dk/api/v1/fuel-prices";


async function loadPrices() {
    const status = document.getElementById("status");
    const container = document.getElementById("stations");

    status.textContent = "Henter priser...";

    try {
        const response = await fetch(API_URL, {
            credentials: "omit"
        });

        if (!response.ok) {
            throw new Error(
                `HTTP fejl ${response.status}: ${response.statusText}`
            );
        }

        const data = await response.json();

        // Vis API-strukturen i browserens konsol
        console.log("Hele API-svaret:", data);
        console.log("Første station:", data.items?.[0]);

        if (!Array.isArray(data.items)) {
            throw new Error(
                "API-svaret indeholder ikke et items-array."
            );
        }

        // Kun postnummer 3550
        const stations = data.items.filter(station =>
            String(station.postal_code) === "3550"
        );

        container.innerHTML = "";

        if (stations.length === 0) {
            status.textContent =
                "API virker, men ingen stationer blev fundet i 3550.";

            return;
        }

        // Sorter stationer efter billigste pris
        stations.sort((a, b) => {
            const priceA = Math.min(
                ...(a.prices || []).map(p => Number(p.price))
            );

            const priceB = Math.min(
                ...(b.prices || []).map(p => Number(p.price))
            );

            return priceA - priceB;
        });

        stations.forEach(station => {
            const div = document.createElement("div");
            div.className = "station";

            const heading = document.createElement("h2");
            heading.textContent = "OK Tankstation";

            const address = document.createElement("div");
            address.className = "address";
            address.textContent =
                `${station.street || ""} ${station.house_number || ""}, ${station.postal_code} ${station.city || ""}`;

            div.appendChild(heading);
            div.appendChild(address);

            (station.prices || []).forEach(fuel => {
                const row = document.createElement("div");
                row.className = "fuel";

                const name = document.createElement("span");
                name.textContent = fuel.product_name;

                const price = document.createElement("span");
                price.className = "price";
                price.textContent =
                    Number(fuel.price).toFixed(2).replace(".", ",") + " kr.";

                row.appendChild(name);
                row.appendChild(price);
                div.appendChild(row);
            });

            container.appendChild(div);
        });

        status.textContent =
            `Fandt ${stations.length} stationer i 3550. Sidst opdateret: ${new Date().toLocaleTimeString("da-DK")}`;

    } catch (error) {
        console.error("Fejl ved API-kald:", error);

        status.textContent =
            "Fejl: " + error.message;

        container.innerHTML = "";
    }
}

// Hent priser ved opstart
loadPrices();

// Opdater hvert 2. minut
setInterval(loadPrices, 120000);

</script>

</body>
</html>
